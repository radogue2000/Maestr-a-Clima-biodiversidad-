<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="700" viewBox="0 0 1700 700" role="img" aria-labelledby="title desc">
  <title id="title">Estructura metodológica general</title>
  <desc id="desc">Diagrama en blanco y negro de las tres fases de la estructura metodológica general.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#111111"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; }
      .phase { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #111111; }
      .detail { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #111111; }
    </style>
  </defs>

  <rect width="1700" height="700" fill="#ffffff"/>

  <rect x="100" y="35" width="1500" height="82" class="box"/>
  <text x="850" y="86" text-anchor="middle" class="title">ESTRUCTURA METODOLÓGICA GENERAL</text>

  <rect x="100" y="155" width="1500" height="110" class="box"/>
  <text x="850" y="198" text-anchor="middle" class="phase">FASE I: Fundamentación Teórica, Estado del Arte y Análisis Bibliométrico</text>
  <text x="850" y="232" text-anchor="middle" class="detail">(RSL + Google Scholar + VOSviewer + Marcos Epistemológicos)</text>

  <line x1="850" y1="265" x2="850" y2="315" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="100" y="325" width="1500" height="110" class="box"/>
  <text x="850" y="368" text-anchor="middle" class="phase">FASE II: Diagnóstico Local de FORSU en Toluca y Modelo Conceptual GEOIA</text>
  <text x="850" y="402" text-anchor="middle" class="detail">(Análisis Espacial en QGIS + Estimación con Algoritmos IA + Fuentes Oficiales)</text>

  <line x1="850" y1="435" x2="850" y2="485" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="100" y="495" width="1500" height="125" class="box"/>
  <text x="850" y="538" text-anchor="middle" class="phase">FASE III: Prospección Futura, Modelo de Arquitectura y Mitigación de CH₄</text>
  <text x="850" y="574" text-anchor="middle" class="detail">(Modelación de Series de Tiempo + Estimación de Emisiones IPCC: 269.56 a 215.65)</text>
</svg>
