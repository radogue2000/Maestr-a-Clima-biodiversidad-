<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Desglose de referencias del encuadre teórico</title>
  <desc id="desc">Tabla académica formal en blanco y negro con las cadenas de búsqueda y referencias integradas del encuadre teórico.</desc>
  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; font-weight: bold; letter-spacing: 0.8px; fill: #000; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #000; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: bold; fill: #fff; }
      .axis { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: bold; fill: #000; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #000; }
      .count { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: bold; fill: #000; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-style: italic; fill: #000; }
      .rule { stroke: #000; stroke-width: 1.5; }
      .outer { fill: #fff; stroke: #000; stroke-width: 2; }
      .headbox { fill: #000; stroke: #000; stroke-width: 1.5; }
      .shade { fill: #f2f2f2; }
    </style>
  </defs>

  <rect width="1800" height="760" fill="#fff"/>
  <text x="900" y="54" text-anchor="middle" class="title">DESGLOSE DE REFERENCIAS DEL ENCUADRE TEÓRICO</text>
  <line x1="260" y1="74" x2="1540" y2="74" class="rule"/>
  <text x="900" y="103" text-anchor="middle" class="subtitle">Síntesis de las fuentes recuperadas mediante estrategias de búsqueda especializadas</text>

  <rect x="70" y="135" width="1660" height="72" class="headbox"/>
  <line x1="410" y1="135" x2="410" y2="207" class="rule"/>
  <line x1="1080" y1="135" x2="1080" y2="207" class="rule"/>
  <text x="240" y="180" text-anchor="middle" class="head">EJE CONCEPTUAL</text>
  <text x="745" y="180" text-anchor="middle" class="head">CADENA DE BÚSQUEDA</text>
  <text x="1405" y="180" text-anchor="middle" class="head">REFERENCIAS INTEGRADAS</text>

  <rect x="70" y="207" width="1660" height="438" class="outer"/>
  <rect x="71" y="208" width="338" height="437" class="shade"/>
  <line x1="410" y1="207" x2="410" y2="645" class="rule"/>
  <line x1="1080" y1="207" x2="1080" y2="645" class="rule"/>
  <line x1="70" y1="317" x2="1730" y2="317" class="rule"/>
  <line x1="70" y1="427" x2="1730" y2="427" class="rule"/>
  <line x1="70" y1="537" x2="1730" y2="537" class="rule"/>

  <text x="240" y="258" text-anchor="middle" class="axis"><tspan x="240">Teoría General de</tspan><tspan x="240" dy="28">Sistemas (TGS)</tspan></text>
  <text x="445" y="252" class="body"><tspan x="445">("general systems theory" OR "TSG")</tspan><tspan x="445" dy="28">AND ("organic waste")</tspan></text>
  <text x="1115" y="273" class="count">53 obras</text>

  <text x="240" y="368" text-anchor="middle" class="axis"><tspan x="240">Teoría del Caos</tspan></text>
  <text x="445" y="362" class="body"><tspan x="445">("chaos theory" OR "TC")</tspan><tspan x="445" dy="28">AND ("organic waste")</tspan></text>
  <text x="1115" y="383" class="count">56 obras</text>

  <text x="240" y="478" text-anchor="middle" class="axis"><tspan x="240">Sistemas Complejos</tspan></text>
  <text x="445" y="472" class="body"><tspan x="445">("complex system")</tspan><tspan x="445" dy="28">AND ("organic waste")</tspan></text>
  <text x="1115" y="466" class="count"><tspan x="1115">123 obras</tspan><tspan x="1115" dy="28">(incluye 3 en español)</tspan></text>

  <text x="240" y="588" text-anchor="middle" class="axis"><tspan x="240">Saberes</tspan><tspan x="240" dy="28">Ambientales</tspan></text>
  <text x="445" y="582" class="body"><tspan x="445">("environmental knowledge")</tspan><tspan x="445" dy="28">AND ("organic waste")</tspan></text>
  <text x="1115" y="576" class="count"><tspan x="1115">47 obras</tspan><tspan x="1115" dy="28">(incluye 13 en español)</tspan></text>

  <line x1="70" y1="680" x2="1730" y2="680" class="rule"/>
  <text x="70" y="715" class="note">Nota: el total de referencias integradas es de 279 obras; las cadenas se presentan con la sintaxis empleada en la búsqueda bibliográfica.</text>
</svg>
