<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Ejes de recomendaciones técnico-operativas de la Fase III</title>
  <desc id="desc">Tabla académica formal en blanco y negro que presenta cuatro ejes de recomendaciones técnico-operativas y su alcance operativo conceptual.</desc>
  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 32px; font-weight: bold; letter-spacing: 0.7px; fill: #000; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #000; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: bold; fill: #fff; }
      .axis { font-family: Georgia, 'Times New Roman', serif; font-size: 24px; font-weight: bold; fill: #000; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #000; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-style: italic; fill: #000; }
      .rule { stroke: #000; stroke-width: 1.5; }
      .outer { fill: #fff; stroke: #000; stroke-width: 2.5; }
      .headbox { fill: #000; stroke: #000; stroke-width: 1.5; }
      .shade { fill: #f4f4f4; }
    </style>
  </defs>

  <rect width="1800" height="900" fill="#fff"/>

  <text x="900" y="58" text-anchor="middle" class="title">EJES DE RECOMENDACIONES TÉCNICO-OPERATIVAS (FASE III)</text>
  <line x1="260" y1="80" x2="1540" y2="80" class="rule"/>
  <text x="900" y="112" text-anchor="middle" class="subtitle">Síntesis del alcance operativo conceptual de las recomendaciones</text>

  <rect x="70" y="150" width="1660" height="78" class="headbox"/>
  <line x1="430" y1="150" x2="430" y2="228" class="rule"/>
  <text x="250" y="198" text-anchor="middle" class="head">EJE</text>
  <text x="1080" y="198" text-anchor="middle" class="head">ALCANCE OPERATIVO CONCEPTUAL</text>

  <rect x="70" y="228" width="1660" height="560" class="outer"/>
  <rect x="71" y="229" width="358" height="558" class="shade"/>
  <line x1="430" y1="228" x2="430" y2="788" class="rule"/>
  <line x1="70" y1="368" x2="1730" y2="368" class="rule"/>
  <line x1="70" y1="508" x2="1730" y2="508" class="rule"/>
  <line x1="70" y1="648" x2="1730" y2="648" class="rule"/>

  <text x="250" y="310" text-anchor="middle" class="axis">
    <tspan x="250">1. Recorridos</tspan>
  </text>
  <text x="470" y="286" class="body">
    <tspan x="470">Reestructuración teórica de rutas con algoritmos VRP para</tspan>
    <tspan x="470" dy="34">minimizar kilómetros recorridos y emisiones asociadas.</tspan>
  </text>

  <text x="250" y="450" text-anchor="middle" class="axis">
    <tspan x="250">2. Separación</tspan>
  </text>
  <text x="470" y="406" class="body">
    <tspan x="470">Protocolos conceptuales de separación en fuente (hogares y</tspan>
    <tspan x="470" dy="34">comercios) vinculados a esquemas de incentivos y alertas.</tspan>
  </text>

  <text x="250" y="590" text-anchor="middle" class="axis">
    <tspan x="250">3. Reúso</tspan>
  </text>
  <text x="470" y="546" class="body">
    <tspan x="470">Esquemas de canalización de FORSU hacia compostaje y</tspan>
    <tspan x="470" dy="34">biodigestión anaeróbica para aprovechamiento energético.</tspan>
  </text>

  <text x="250" y="730" text-anchor="middle" class="axis">
    <tspan x="250">4. Depósitos</tspan>
  </text>
  <text x="470" y="686" class="body">
    <tspan x="470">Directrices para evitar el vertido de FORSU en sitios a cielo</tspan>
    <tspan x="470" dy="34">abierto, reduciendo lixiviados y la generación de metano.</tspan>
  </text>

  <line x1="70" y1="825" x2="1730" y2="825" class="rule"/>
  <text x="70" y="858" class="note">Nota: FORSU = fracción orgánica de los residuos sólidos urbanos; VRP = problema de ruteo de vehículos.</text>
</svg>
